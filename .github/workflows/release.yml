name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Only verify the package (do not publish)'
        required: false
        default: 'true'

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Use npm CLI with trusted publishing support
        run: npm install -g npm@11.15.0
      - name: Check tag matches package version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "package version: $VERSION"
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${GITHUB_REF_NAME#v}"
            echo "tag: $TAG"
            test "$TAG" = "$VERSION" || { echo "tag/version mismatch"; exit 1; }
          fi
      - name: Syntax check
        run: npm run check
      - name: Package dry run
        run: npm pack --dry-run
      - name: Publish to npm (OIDC trusted publishing)
        if: github.event_name == 'push'
        run: |
          # No token: npm exchanges the GitHub Actions OIDC identity for a
          # short-lived publish credential configured in the package settings.
          unset NODE_AUTH_TOKEN
          npm publish --access public --provenance
      - name: Create GitHub release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
