name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Only verify the package (do not publish)'
        required: false
        default: 'true'

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Use npm CLI with trusted publishing support
        run: npm install -g npm@11.15.0
      - name: Check tag matches package version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "package version: $VERSION"
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${GITHUB_REF_NAME#v}"
            echo "tag: $TAG"
            test "$TAG" = "$VERSION" || { echo "tag/version mismatch"; exit 1; }
          fi
      - name: Syntax check
        run: npm run check
      - name: Package dry run
        run: npm pack --dry-run
      - name: Publish or reuse staged build
        if: github.event_name == 'push'
        env:
          FALLBACK_NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          NAME=$(node -p "require('./package.json').name")

          # Publishing from the CLI and pushing a tag are two independent paths
          # to the same version. If the version is already live (for example a
          # local `npm run release` finished first), only align the tag and let
          # the release job continue instead of failing the run with 409.
          if npm view "$NAME@$VERSION" version 2>/dev/null | grep -qx "$VERSION"; then
            echo "::notice::$VERSION is already published; skipping publish"
          else
            # A version that already sits in npm's staging area makes
            # `npm publish` fail with 409. Approving that record is the only way
            # forward, and it is also the right action: same version, same build.
            STAGED_ID=$(npm stage list "$NAME" 2>/dev/null | awk -v want="$VERSION" '
              /^id:/      { id=$2 }
              /^version:/ { ver=$2 }
              /^status:/  { if ($2 == "staged" && ver == want) print id }
            ' | head -n 1)

            if [ -n "${STAGED_ID:-}" ]; then
              echo "::notice::Reusing staged build $STAGED_ID for $VERSION"
              unset NODE_AUTH_TOKEN
              npm stage approve "$STAGED_ID" \
                || npm stage approve "$STAGED_ID" --//registry.npmjs.org/:_authToken="$FALLBACK_NPM_TOKEN"
            else
              unset NODE_AUTH_TOKEN
              if ! npm publish --access public --provenance; then
                echo "OIDC trusted publishing was not accepted; using NPM_TOKEN fallback."
                npm publish --access public --provenance --//registry.npmjs.org/:_authToken="$FALLBACK_NPM_TOKEN"
              fi
            fi
          fi

          # A release only becomes installable once `latest` points at it.
          # Approving a staged build does not move the tag — that is how 2.5.0
          # shipped while `latest` stayed on 2.2.0.
          npm dist-tag add "$NAME@$VERSION" latest \
            || npm dist-tag add "$NAME@$VERSION" latest --//registry.npmjs.org/:_authToken="$FALLBACK_NPM_TOKEN"

          echo "latest=$(npm dist-tag ls "$NAME" | sed -n 's/^latest: //p')"
      - name: Create GitHub release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag || echo "release already exists"
